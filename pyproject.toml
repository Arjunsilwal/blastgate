[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "blastgate"
version = "0.1.0"
description = "Egress control and isolation for package managers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    # Cargo manifests and lockfiles are TOML. tomllib is stdlib from 3.11; this
    # is the backport for the 3.10 this project claims to support.
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
blast = "blastgate.cli:main"

[tool.setuptools.packages.find]
include = ["blastgate*"]
