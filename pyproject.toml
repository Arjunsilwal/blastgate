[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bulkhead"
version = "0.1.0"
description = "Egress control and isolation for package managers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[project.scripts]
bh = "bulkhead.cli:main"

[tool.setuptools.packages.find]
include = ["bulkhead*"]
