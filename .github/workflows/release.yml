name: Release

on:
  push:
    tags: ["v*"]

# Trusted publishing: PyPI verifies this workflow's identity through OIDC, so
# there is no long-lived API token stored anywhere. A token in a repository
# secret is a credential that can be stolen, which is the whole subject of this
# project.
permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and check
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - name: Refuse to publish a wheel that is missing its data
        # The first wheel built by this project contained the modules and none
        # of the allowlists, and imported perfectly while being unusable.
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          names = set(zipfile.ZipFile(sorted(glob.glob("dist/*.whl"))[-1]).namelist())
          required = [
              f"blastgate/allowlists/{e}{s}.yaml"
              for e in ("npm", "pypi", "cargo") for s in ("", "-resolve")
          ] + ["blastgate/docker/proxy.Dockerfile"]
          missing = [r for r in required if r not in names]
          if missing:
              sys.exit("wheel is missing: " + ", ".join(missing))
          print("wheel contains every allowlist and Dockerfile")
          PY
      - name: Verify the tag matches the packaged version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $tag does not match pyproject version $version"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
