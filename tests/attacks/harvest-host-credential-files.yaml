id: harvest-host-credential-files
title: Payload reads credential files from the host filesystem
chain_link: 4
ecosystem: npm
source: constructed
expect: denied
requires: sandbox
check: filesystem
paths:
  # Credential files, not directories. An earlier version of this scenario
  # listed /home, which exists as an empty directory in almost every base image
  # and so reported a leak that was not one. A scenario that fails for a reason
  # unrelated to the control is worse than no scenario.
  - /root/.npmrc
  - /root/.aws/credentials
  - /root/.ssh/id_rsa
  - /root/.docker/config.json
  - /root/.gitconfig
  - /root/.netrc
  # Host mount points. /Users would exist only if the macOS host filesystem
  # were mounted; the socket would be a container escape with extra steps.
  - /Users
  - /var/run/docker.sock
  - /host
note: >
  Link 4, the other half of the harvest. The environment filter covers
  variables; this covers files. It depends entirely on the mount boundary: the
  project directory is the only thing from the host inside the sandbox, so none
  of these paths resolve to anything the host owns.
